substitutions: !include local.yaml

esphome:
  name: co2-sensor
  friendly_name: CO2 Sensor
  includes:
    - rtc_graph.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Release GPIO hold from deep sleep so display can update
          gpio_hold_dis(GPIO_NUM_5);
          gpio_hold_dis(GPIO_NUM_16);
          gpio_hold_dis(GPIO_NUM_17);
          gpio_deep_sleep_hold_dis();
          // Diagnostic: capture reset cause + pre-validate RTC state.
          // Catches brownouts, WDTs, and RTC-SLOW-MEM power loss across sleep.
          // When magic mismatch indicates a wipe, stash the cause in RTC
          // vars that survive subsequent OK wakes, so the reason is
          // retrievable later via WiFi-on log session.
          {
            esp_reset_reason_t rr = esp_reset_reason();
            esp_sleep_wakeup_cause_t wc = esp_sleep_get_wakeup_cause();
            bool wiped = (rtc_magic != RTC_MAGIC_VAL);
            if (wiped) {
              rtc_last_wipe_reason = (uint8_t)rr;
              rtc_last_wipe_wakeup = (uint8_t)wc;
              rtc_last_wipe_boot   = (uint32_t)rtc_boot_count;
            }
            auto name_of = [](esp_reset_reason_t r) {
              return r == ESP_RST_POWERON   ? "POWERON"   :
                     r == ESP_RST_EXT       ? "EXT"       :
                     r == ESP_RST_SW        ? "SW"        :
                     r == ESP_RST_PANIC     ? "PANIC"     :
                     r == ESP_RST_INT_WDT   ? "INT_WDT"   :
                     r == ESP_RST_TASK_WDT  ? "TASK_WDT"  :
                     r == ESP_RST_WDT       ? "WDT"       :
                     r == ESP_RST_DEEPSLEEP ? "DEEPSLEEP" :
                     r == ESP_RST_BROWNOUT  ? "BROWNOUT"  :
                     "UNKNOWN";
            };
            ESP_LOGW("boot", "reset=%s(%d) wake=%d rtc_boot#=%d buf=%d magic=%s",
                     name_of(rr), rr, wc, rtc_boot_count, rtc_count,
                     wiped ? "WIPED" : "OK");
            ESP_LOGW("boot", "last_wipe: reason=%s(%d) wake=%d at_boot#=%u",
                     name_of((esp_reset_reason_t)rtc_last_wipe_reason),
                     rtc_last_wipe_reason, rtc_last_wipe_wakeup,
                     (unsigned)rtc_last_wipe_boot);
          }
          rtc_validate();  // Fix garbage RTC after firmware change / power cycle
          rtc_boot_count++;
          // Restore battery state from RTC (survives deep sleep)
          if (rtc_batt_pct > 0) {
            id(battery_pct) = rtc_batt_pct;
            id(last_battery_voltage) = rtc_last_batt_v;
            id(is_charging) = rtc_is_charging;
          }
          const char* layout_name = id(current_layout) == 0 ? "CO2+info" : "CO2+graph";
          int s = id(update_interval_secs);
          const char* interval_name = s == 60 ? "1min" : (s == 120 ? "2min" : "5min");
          ESP_LOGI("boot", "=== Boot #%d === Layout:%s Interval:%s WiFi:%s Buf:%d",
                   rtc_boot_count, layout_name, interval_name,
                   id(wifi_enabled) ? "ON" : "OFF", rtc_count);
          // Detect button wake — switch layout
          auto cause = esp_sleep_get_wakeup_cause();
          if (cause == ESP_SLEEP_WAKEUP_EXT0) {
            id(current_layout) = (id(current_layout) + 1) % 2;
            ESP_LOGI("boot", "Button wake — layout switched to %d", id(current_layout));
          }
      - lambda: |-
          id(last_display_update) = 0;
          id(last_measurement_time) = 0;
          // Set dynamic sleep duration
          id(deep_sleep_ctrl).set_sleep_duration(id(update_interval_secs) * 1000);
      # Disable WiFi if needed
      - if:
          condition:
            lambda: return !id(wifi_enabled);
          then:
            - wifi.disable:
      # SCD41 warmup (datasheet min 1s, 3s for safety margin)
      - delay: 3s
      # Read battery ADC + trigger CO2 measurement
      - component.update: battery_voltage
      - component.update: scd4x_sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: HIGH
  fast_connect: true
  reboot_timeout: 0s
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: ${subnet}
    dns1: 8.8.8.8
    dns2: 1.1.1.1
  ap:
    ssid: ${fallback_ap_ssid}
    password: ${fallback_ap_password}

# BLE advertising for BTHome protocol
esp32_ble:
  advertising: true

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# Disable safe_mode: its boot-loop detector counts every deep-sleep wake
# as a "failed boot" (uptime < boot_is_good_after, default 60s) and
# eventually triggers an OTA rollback that cold-boots the chip and wipes
# RTC memory — observed a couple of times per day in deep-sleep mode.
safe_mode:
  disabled: true

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - "0.pool.ntp.org"
      - "time.cloudflare.com"
    on_time_sync:
      - if:
          condition:
            lambda: return id(wifi_enabled);
          then:
            - component.update: epaper_display

# Deep sleep: only entered when WiFi is OFF (after BLE burst)
# Button GPIO39 also wakes device (RTC GPIO)
deep_sleep:
  id: deep_sleep_ctrl
  wakeup_pin:
    number: GPIO39
    inverted: true
    allow_other_uses: true

globals:
  - id: current_layout
    type: int
    restore_value: yes
    initial_value: '0'
  - id: update_interval_idx
    type: int
    restore_value: yes
    initial_value: '0'
  - id: update_interval_secs
    type: int
    restore_value: yes
    initial_value: '60'
  - id: last_display_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_measurement_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_battery_voltage
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: is_charging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: is_usb_plugged
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: battery_pct
    type: int
    restore_value: no
    initial_value: '0'
  - id: wifi_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

# Button GPIO39
# Short click  = switch layout
# Long press   = change update interval (1→2→5min)
# Double click = toggle WiFi ON/OFF
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
      allow_other_uses: true
      mode:
        input: true
    name: "Button"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_multi_click:
      # Double click = WiFi toggle
      - timing:
          - ON for at most 500ms
          - OFF for at most 350ms
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(wifi_enabled) = !id(wifi_enabled);
              ESP_LOGI("button", "WiFi toggled: %s", id(wifi_enabled) ? "ON" : "OFF");
          - if:
              condition:
                lambda: return id(wifi_enabled);
              then:
                - wifi.enable:
                - deep_sleep.prevent: deep_sleep_ctrl
                - component.update: epaper_display
              else:
                - wifi.disable:
                - component.update: epaper_display
                - delay: 3s
                - component.update: battery_voltage
                - component.update: scd4x_sensor
      # Long press (1-5s) = change interval
      - timing:
          - ON for 1000ms to 5000ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              int intervals[] = {60, 120, 300};
              id(update_interval_idx) = (id(update_interval_idx) + 1) % 3;
              id(update_interval_secs) = intervals[id(update_interval_idx)];
              id(last_display_update) = millis() / 1000;
              ESP_LOGI("button", "Interval changed to %ds", id(update_interval_secs));
          - component.update: epaper_display
      # Short single click = layout change
      - timing:
          - ON for at most 500ms
          - OFF for at least 400ms
        then:
          - lambda: |-
              id(current_layout) = (id(current_layout) + 1) % 2;
              id(last_display_update) = millis() / 1000;
              ESP_LOGI("button", "Layout switched to %d", id(current_layout));
          - component.update: epaper_display

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

script:
  - id: ble_advertise
    then:
      - lambda: |-
          std::vector<uint8_t> data;
          data.push_back(0x40);
          if (id(co2_value).has_state()) {
            uint16_t co2 = (uint16_t)id(co2_value).state;
            data.push_back(0x12);
            data.push_back(co2 & 0xFF);
            data.push_back((co2 >> 8) & 0xFF);
          }
          if (id(temp_value).has_state()) {
            int16_t temp = (int16_t)(id(temp_value).state * 100.0f);
            data.push_back(0x02);
            data.push_back((uint8_t)(temp & 0xFF));
            data.push_back((uint8_t)((temp >> 8) & 0xFF));
          }
          if (id(humidity_value).has_state()) {
            uint16_t hum = (uint16_t)(id(humidity_value).state * 100.0f);
            data.push_back(0x03);
            data.push_back(hum & 0xFF);
            data.push_back((hum >> 8) & 0xFF);
          }
          data.push_back(0x01);
          data.push_back((uint8_t)id(battery_pct));
          std::vector<uint8_t> sd;
          sd.push_back(0xD2);
          sd.push_back(0xFC);
          sd.insert(sd.end(), data.begin(), data.end());
          if (esphome::esp32_ble::global_ble) {
            esphome::esp32_ble::global_ble->advertising_set_service_data(sd);
          }

sensor:
  - platform: scd4x
    co2:
      name: "CO2"
      id: co2_value
      on_value:
        then:
          # Save to RTC circular buffer and update timestamp
          - lambda: |-
              // Calculate actual elapsed time since last measurement
              uint32_t now_s = millis() / 1000;
              uint16_t elapsed = id(last_measurement_time) > 0
                ? (uint16_t)(now_s - id(last_measurement_time))
                : (uint16_t)id(update_interval_secs);
              if (elapsed < 1) elapsed = 1;
              // Cap to 2x interval — prevents a single sensor glitch from
              // consuming the entire 1h graph window
              uint16_t max_step = (uint16_t)(id(update_interval_secs) * 2);
              if (elapsed > max_step) {
                ESP_LOGW("co2", "Elapsed %us capped to %us (sensor glitch?)", elapsed, max_step);
                elapsed = max_step;
              }
              rtc_push_co2(x, elapsed);
              id(last_measurement_time) = now_s;
              id(last_display_update) = now_s;
              ESP_LOGI("co2", "CO2=%.0f ppm, elapsed=%us, buf=%d pts", x, elapsed, rtc_count);
          # Wait for temp/humidity to arrive (SCD4x publishes CO2 first)
          - delay: 200ms
          # Refresh e-paper display
          - component.update: epaper_display
          # Wait for e-paper refresh to complete before sleep
          - delay: 3s
          # BLE burst: 3 packets over 6s so Pi catches the signal
          - script.execute: ble_advertise
          - delay: 3s
          - script.execute: ble_advertise
          - delay: 3s
          - script.execute: ble_advertise
          # Enter deep sleep if WiFi is OFF
          - lambda: |-
              if (!id(wifi_enabled) && !id(is_usb_plugged)) {
                // Hold e-paper GPIO states so display doesn't blank during sleep
                gpio_hold_en(GPIO_NUM_5);   // CS
                gpio_hold_en(GPIO_NUM_16);  // RESET
                gpio_hold_en(GPIO_NUM_17);  // DC
                gpio_deep_sleep_hold_en();
                // Set sleep duration and enter sleep
                uint32_t dur_ms = id(update_interval_secs) * 1000;
                ESP_LOGI("sleep", "Entering deep sleep for %d s", id(update_interval_secs));
                id(deep_sleep_ctrl).set_sleep_duration(dur_ms);
                id(deep_sleep_ctrl).begin_sleep(true);
              } else if (id(is_usb_plugged)) {
                ESP_LOGI("sleep", "USB plugged — staying awake");
              }
    temperature:
      name: "Temperature"
      id: temp_value
    humidity:
      name: "Humidity"
      id: humidity_value
    measurement_mode: single_shot
    update_interval: never
    id: scd4x_sensor

  - platform: adc
    pin: GPIO35
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: auto
    update_interval: never
    filters:
      - multiply: 2.0
    on_value:
      then:
        - lambda: |-
            float v = x;
            // Li-Ion nonlinear discharge curve
            const float vtable[] = {4.20f,4.10f,4.00f,3.90f,3.80f,3.70f,3.60f,3.50f,3.40f,3.30f,3.20f};
            const int   ptable[] = {100,  95,   90,   80,   70,   60,   50,   35,   20,   10,    5};
            const int tsize = 11;
            int pct = 5;
            if (v >= vtable[0]) {
              pct = 100;
            } else if (v > vtable[tsize-1]) {
              for (int i = 0; i < tsize-1; i++) {
                if (v >= vtable[i+1]) {
                  float ratio = (v - vtable[i+1]) / (vtable[i] - vtable[i+1]);
                  pct = ptable[i+1] + (int)(ratio * (ptable[i] - ptable[i+1]));
                  break;
                }
              }
            }
            id(battery_pct) = pct;
            // USB plugged when battery terminal exceeds Li-ion max (charger holds it higher)
            id(is_usb_plugged) = (v > 4.25f);
            id(is_charging) = id(is_usb_plugged);
            id(last_battery_voltage) = v;
            // Persist battery state in RTC (survives deep sleep)
            rtc_batt_pct = pct;
            rtc_last_batt_v = v;
            rtc_is_charging = id(is_charging);

# In WiFi-ON (awake) mode: trigger measurement when interval elapses
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(wifi_enabled) && !id(is_usb_plugged)) return false;
              if (id(last_measurement_time) == 0) return false;
              uint32_t now_s = millis() / 1000;
              return (now_s - id(last_measurement_time)) >= (uint32_t)id(update_interval_secs);
          then:
            - component.update: battery_voltage
            - component.update: scd4x_sensor
  # Periodic echo of last-wipe diagnostic. Fires while device is awake
  # (WiFi ON) so the info is retrievable any time a log session attaches.
  - interval: 60s
    then:
      - lambda: |-
          if (rtc_last_wipe_reason != 0) {
            ESP_LOGW("diag", "last_wipe: reason=%d wakeup=%d at_boot#=%u (boot#=%d, buf=%d)",
                     rtc_last_wipe_reason, rtc_last_wipe_wakeup,
                     (unsigned)rtc_last_wipe_boot, rtc_boot_count, rtc_count);
          } else {
            ESP_LOGI("diag", "no wipe seen yet (boot#=%d, buf=%d)",
                     rtc_boot_count, rtc_count);
          }

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 2.13in-ttgo-b74
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO16
    busy_pin: GPIO4
    rotation: 90
    full_update_every: 30
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);

      // === HEADER (both layouts) ===
      {
        const char* status = "";
        if (id(co2_value).has_state()) {
          float co2 = id(co2_value).state;
          status = co2 < 800 ? "GOOD" : (co2 < 1200 ? "OK" : "HIGH!");
        } else if (rtc_count > 0) {
          float co2 = rtc_get_co2_at(0);
          status = co2 < 800 ? "GOOD" : (co2 < 1200 ? "OK" : "HIGH!");
        }
        it.print(0, 1, id(font_small), "CO2 | ${display_name}");
        it.print(250 - (int)(strlen(status) * 8), 1, id(font_small), status);
        it.line(0, 16, 250, 16);
      }

      if (id(current_layout) == 0) {
        // === LAYOUT 0: large CO2 + temp/hum ===
        if (id(co2_value).has_state()) {
          it.printf(75, 18, id(font_huge), "%.0f", id(co2_value).state);
          it.print(185, 42, id(font_medium), "ppm");
        } else if (rtc_count > 0) {
          it.printf(75, 18, id(font_huge), "%.0f", rtc_get_co2_at(0));
          it.print(185, 42, id(font_medium), "ppm");
        } else {
          it.print(30, 30, id(font_medium), "Loading...");
        }
        if (id(temp_value).has_state() && id(humidity_value).has_state()) {
          char buf[32];
          sprintf(buf, "%.1fC   %.0f%%", id(temp_value).state, id(humidity_value).state);
          int tw = strlen(buf) * 9;
          it.print((250 - tw) / 2, 76, id(font_medium), buf);
        }
      } else {
        // === LAYOUT 1: CO2 history graph from RTC buffer ===
        const int GT = 16, GB = 75;   // graph top/bottom y pixel
        const int GH = GB - GT;       // 59px height
        const int GW = 249;           // graph width (x: 0..249)
        const int CO2_MIN = 390, CO2_MAX = 1800;

        // Graph border
        it.rectangle(0, GT, GW + 1, GH + 1);

        if (rtc_count == 0) {
          it.print(30, 40, id(font_medium), "Loading...");
        } else {
          // Grid: dotted vertical + dotted horizontal
          for (int g = 1; g <= 3; g++) {
            int gx = g * GW / 4;
            for (int dy = GT; dy < GB; dy += 4) it.line(gx, dy, gx, dy + 1);
            int gy = GT + g * GH / 4;
            for (int dx = 0; dx < GW; dx += 4) it.line(dx, gy, dx + 1, gy);
          }

          // Draw CO2 history: dots + straight lines between points
          // Use per-point stored intervals for correct time positioning
          int prev_x = -1, prev_y = -1;
          int pts = rtc_count < RTC_GRAPH_POINTS ? rtc_count : RTC_GRAPH_POINTS;
          long cumulative_secs = 0;
          for (int i = 0; i < pts; i++) {
            // Advance time BEFORE checking value — a skipped point
            // must still consume its time slot on the axis
            if (i > 0) cumulative_secs += rtc_get_step_at(i - 1);
            int x = GW - (int)(cumulative_secs * GW / 3600);
            if (x < 0) break;  // older than 1h window

            float cv = rtc_get_co2_at(i);  // i=0 newest, i=pts-1 oldest
            if (cv <= 0.0f) continue;  // skip invalid but time already advanced

            int ppm = (int)cv;
            if (ppm < CO2_MIN) ppm = CO2_MIN;
            if (ppm > CO2_MAX) ppm = CO2_MAX;
            int y = GB - (ppm - CO2_MIN) * GH / (CO2_MAX - CO2_MIN);

            // Line from this point to previous (newer) point (2px thick)
            if (prev_x >= 0) {
              it.line(x, y, prev_x, prev_y);
              it.line(x, y + 1, prev_x, prev_y + 1);
            }
            // Dot: 5x5 filled square
            it.filled_rectangle(x - 2, y - 2, 5, 5);

            prev_x = x;
            prev_y = y;
          }
        }

        // Current readings below graph
        float show_co2 = id(co2_value).has_state() ? id(co2_value).state
                       : (rtc_count > 0 ? rtc_get_co2_at(0) : 0.0f);
        if (show_co2 > 0 && id(temp_value).has_state() && id(humidity_value).has_state()) {
          it.printf(0, 78, id(font_small), "%.0fppm  %.1fC  %.0f%%",
                    show_co2, id(temp_value).state, id(humidity_value).state);
        } else if (show_co2 > 0) {
          it.printf(0, 78, id(font_small), "%.0f ppm", show_co2);
        } else {
          it.print(0, 78, id(font_small), "Loading...");
        }
      }

      // === BOTTOM BAR (both layouts) ===
      it.line(0, 96, 250, 96);
      {
        // Interval label only — wall-clock omitted because the RTC slow
        // clock drifts across long deep sleep (no SNTP re-sync in WiFi-OFF)
        // and e-ink is static between wakes, so any "ago" rendered at draw
        // time would always read ~0s.
        int s = id(update_interval_secs);
        const char* istr = s == 60 ? "1m" : (s == 120 ? "2m" : "5m");
        it.print(0, 99, id(font_small), istr);

        // WiFi status icon (MDI)
        int wix = 105, wiy = 98;
        if (id(wifi_enabled)) {
          it.print(wix, wiy, id(font_mdi), "\U000F05A9");  // mdi-wifi
        } else {
          it.print(wix, wiy, id(font_mdi), "\U000F05AA");  // mdi-wifi-off
        }

        // BLE icon (MDI) — always active
        int bix = 122, biy = 98;
        it.print(bix, biy, id(font_mdi), "\U000F00AF");  // mdi-bluetooth
      }
      // Battery % + icon
      {
        int pct = id(battery_pct);
        int bx = 225, by = 100, bw = 24, bh = 11;
        int fill_w = (int)((float)(bw - 2) * pct / 100.0f);
        it.printf(193, 99, id(font_small), "%d%%", pct);
        it.filled_rectangle(bx, by, bw, bh, COLOR_OFF);
        if (fill_w > 0)
          it.filled_rectangle(bx + 1, by + 1, fill_w, bh - 2);
        it.rectangle(bx, by, bw, bh);
        it.filled_rectangle(bx + bw, by + 3, 3, 5);
        if (id(is_charging)) {
          Color bc = (fill_w > (bw-2)*8/10) ? COLOR_OFF : COLOR_ON;
          int lx = bx + bw/2 - 3, ly = by + 1;
          it.line(lx+3, ly,   lx+1, ly+4, bc);
          it.line(lx+1, ly+4, lx+4, ly+4, bc);
          it.line(lx+4, ly+4, lx+2, ly+9, bc);
          it.line(lx+2, ly+9, lx+4, ly+5, bc);
          it.line(lx+4, ly+5, lx+1, ly+5, bc);
          it.line(lx+1, ly+5, lx+3, ly,   bc);
        }
      }

font:
  - file: "fonts/TerminusTTF-Bold-4.46.0.ttf"
    id: font_small
    size: 14
  - file: "fonts/TerminusTTF-Bold-4.46.0.ttf"
    id: font_huge
    size: 52
  - file: "fonts/TerminusTTF-Bold-4.46.0.ttf"
    id: font_medium
    size: 18
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 14
    glyphs:
      - "\U000F05A9"  # mdi-wifi
      - "\U000F05AA"  # mdi-wifi-off
      - "\U000F00AF"  # mdi-bluetooth
